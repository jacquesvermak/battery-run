# Static hosting for Battery Run. index.html + style.css + game.js only.
# The whole game runs client-side — this server only ships bytes.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      text/html image/svg+xml;

    # Liveness/readiness target. Cheap, and never touches the filesystem.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Never let a cached copy mask a deploy — this is the whole app, and it's
    # small enough that there's no real bandwidth cost to always revalidating.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
