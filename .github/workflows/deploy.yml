name: Build and Deploy Battery Run (QA)

# =============================================================================
# Push to main -> build image -> push to Harbor -> rewrite the QA image tag in
# infrastructure/ -> commit back. ArgoCD watches this repo and syncs.
#
# Mirrors sz-loadbreaker-game / sz-zero-hour-game's pipeline: no
# semantic-release, no CHANGELOG, one job. Images are tagged with the commit
# short SHA, plus :latest.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'game.js'
      - 'nginx.conf'
      - 'Dockerfile'
      - '.dockerignore'
      - 'api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  APP_NAME: sz-battery-run-game
  API_APP_NAME: sz-battery-run-leaderboard-api
  INFRASTRUCTURE_PATH: infrastructure/apps/sz-battery-run-game
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HARBOR_URL: ${{ vars.HARBOR_URL || 'harbor.qa.stagezero.co.za' }}

permissions:
  contents: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preflight — required config is present
        env:
          HARBOR_CA_CERT: ${{ secrets.HARBOR_CA_CERT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then echo "::error::$1 is empty — set it before deploying"; fail=1;
            else echo "  ✓ $1 present"; fi
          }
          check "HARBOR_URL"      "${{ env.HARBOR_URL }}"
          check "HARBOR_CA_CERT"  "$HARBOR_CA_CERT"
          check "HARBOR_USERNAME" "$HARBOR_USERNAME"
          check "HARBOR_PASSWORD" "$HARBOR_PASSWORD"
          echo "  registry target: ${{ env.HARBOR_URL }}/library/${{ env.APP_NAME }}"
          exit $fail

      - name: Determine image tag
        id: vars
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Install Harbor CA certificate
        run: |
          echo "${{ secrets.HARBOR_CA_CERT }}" > /tmp/harbor-ca.crt
          sudo mkdir -p /etc/docker/certs.d/${{ env.HARBOR_URL }}
          sudo cp /tmp/harbor-ca.crt /etc/docker/certs.d/${{ env.HARBOR_URL }}/ca.crt
          sudo cp /tmp/harbor-ca.crt /usr/local/share/ca-certificates/harbor-ca.crt
          sudo update-ca-certificates
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.HARBOR_URL }}"]
              ca=["/tmp/harbor-ca.crt"]

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_URL }}/library/${{ env.APP_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.HARBOR_URL }}/library/${{ env.APP_NAME }}:latest
          cache-from: type=registry,ref=${{ env.HARBOR_URL }}/library/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.HARBOR_URL }}/library/${{ env.APP_NAME }}:buildcache,mode=min
        timeout-minutes: 10

      - name: Build and push leaderboard API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_URL }}/library/${{ env.API_APP_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.HARBOR_URL }}/library/${{ env.API_APP_NAME }}:latest
          cache-from: type=registry,ref=${{ env.HARBOR_URL }}/library/${{ env.API_APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.HARBOR_URL }}/library/${{ env.API_APP_NAME }}:buildcache,mode=min
        timeout-minutes: 10

      - name: Update image tag in values.yaml and Chart.yaml
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          # Top-level image.tag (2-space indent) and api.image.tag (4-space
          # indent) are distinct lines — both get the same commit SHA, so
          # every image built from this commit is traceable to it.
          sed -i "s/^  tag: \".*\"/  tag: \"${IMAGE_TAG}\"/" \
            "${{ env.INFRASTRUCTURE_PATH }}/values.yaml"
          sed -i "s/^    tag: \".*\"/    tag: \"${IMAGE_TAG}\"/" \
            "${{ env.INFRASTRUCTURE_PATH }}/values.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${IMAGE_TAG}\"/" \
            "${{ env.INFRASTRUCTURE_PATH }}/Chart.yaml"
          grep -n 'tag:' "${{ env.INFRASTRUCTURE_PATH }}/values.yaml"
          grep -n 'appVersion:' "${{ env.INFRASTRUCTURE_PATH }}/Chart.yaml"

      - name: Commit manifest changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add "${{ env.INFRASTRUCTURE_PATH }}/values.yaml" \
                  "${{ env.INFRASTRUCTURE_PATH }}/Chart.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: deploy ${{ env.APP_NAME }} ${{ steps.vars.outputs.image_tag }} to qa [skip ci]"
            git push
          fi
